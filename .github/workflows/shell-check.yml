name: shell-check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  static:
    name: bash-n and version sync
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bash syntax (blocking)
        run: bash -n vless-server.sh && bash -n nft.sh

      - name: Version consistency (blocking)
        run: |
          set -euo pipefail
          SCRIPT_VER=$(grep -m1 '^readonly VERSION=' vless-server.sh | cut -d'"' -f2)
          if [[ -z "$SCRIPT_VER" ]]; then
            echo "Failed to extract readonly VERSION from vless-server.sh"
            exit 1
          fi
          echo "SCRIPT_VERSION=${SCRIPT_VER}"

          README_VER=$(sed -n 's/^Current script version: \*\*v\([0-9.]*\)\*\*.*/\1/p' README.md | head -n1)
          README_CN_VER=$(sed -n 's/^当前脚本版本：\*\*v\([0-9.]*\)\*\*.*/\1/p' README_CN.md | head -n1)
          echo "README_VERSION=${README_VER}"
          echo "README_CN_VERSION=${README_CN_VER}"

          if [[ -z "$README_VER" || -z "$README_CN_VER" ]]; then
            echo "Failed to extract current version fields from README.md / README_CN.md"
            exit 1
          fi
          if [[ "$README_VER" != "$SCRIPT_VER" ]]; then
            echo "README.md current version (${README_VER}) != script VERSION (${SCRIPT_VER})"
            exit 1
          fi
          if [[ "$README_CN_VER" != "$SCRIPT_VER" ]]; then
            echo "README_CN.md current version (${README_CN_VER}) != script VERSION (${SCRIPT_VER})"
            exit 1
          fi
          echo "VERSION_SYNC=PASS"

      - name: ShellCheck changed functions (informational, non-blocking)
        continue-on-error: true
        env:
          BASE_REV: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          if [[ -z "$BASE_REV" || "$BASE_REV" =~ ^0+$ ]]; then
            BASE_REV=$(git merge-base HEAD origin/main)
          fi
          export BASE_REV
          # Extract only functions containing added/modified lines; never lint the fat script.
          python3 - <<'PY' > changed-functions.sh
          import os, re, subprocess
          diff = subprocess.check_output(
              ['git', 'diff', '--unified=0', os.environ['BASE_REV'], 'HEAD', '--', 'vless-server.sh'],
              text=True)
          changed = set()
          for start, count in re.findall(r'^@@ .* \+(\d+)(?:,(\d+))? @@', diff, re.M):
              start, count = int(start), int(count or 1)
              changed.update(range(start, start + max(1, count)))
          lines = open('vless-server.sh', encoding='utf-8').readlines()
          start = None
          for number, line in enumerate(lines, 1):
              if re.match(r'^[A-Za-z_][A-Za-z0-9_]*\(\) *\{', line):
                  start = number
              if start is not None and line.rstrip('\r\n') == '}':
                  if any(n in changed for n in range(start, number + 1)):
                      print(''.join(lines[start - 1:number]), end='')
                  start = None
          PY
          [[ -s changed-functions.sh ]] || exit 0
          set +e
          shellcheck -s bash -f gcc changed-functions.sh | tee shellcheck-report.txt
          rc=${PIPESTATUS[0]}
          set -e
          echo "SHELLCHECK_EXIT=${rc} (non-blocking)"
          exit 0

  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reject early-exit test pipelines (blocking)
        run: |
          set -euo pipefail
          if grep -nE '\|[[:space:]]*(grep[[:space:]]+-[a-zA-Z]*[qm]|head)\b' tests/*.sh; then
            exit 1
          else
            rc=$?
            if [[ "$rc" -ne 1 ]]; then
              echo "Pipeline lint failed: grep rc=$rc"
              exit "$rc"
            fi
          fi

      - name: Install jq
        run: sudo apt-get update -qq && sudo apt-get install -y -qq jq

      - name: Run offline shell tests (blocking)
        run: |
          set -euo pipefail
          WORK=$(mktemp -d)
          trap 'rm -rf "$WORK"' EXIT
          mkdir -p "$WORK/bin"
          export VLESS_TEST_BLOCKED_CALLS="$WORK/blocked-calls"
          for cmd in apt apt-get apk dnf yum systemctl curl wget sing-box xray ping; do
            cat > "$WORK/bin/$cmd" <<'STUB'
          #!/usr/bin/env bash
          printf '%s\n' "${0##*/} $*" >> "$VLESS_TEST_BLOCKED_CALLS"
          exit 1
          STUB
            chmod +x "$WORK/bin/$cmd"
          done
          export PATH="$WORK/bin:$PATH"
          for t in tests/*.sh; do
            bash "$t" || exit 1
          done
          if [[ -s "$VLESS_TEST_BLOCKED_CALLS" ]]; then
            cat "$VLESS_TEST_BLOCKED_CALLS"
            exit 1
          fi
